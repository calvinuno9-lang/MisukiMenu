<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍣 Menu Sushi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Partículas de fundo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: float 20s infinite linear;
            opacity: 0.1;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(360deg); }
        }

        .container {
            text-align: center;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 600;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .flags-container {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .flag-card {
            position: relative;
            perspective: 1000px;
        }

        .bandeira {
            width: 110px;
            height: 70px;
            border-radius: 20px;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.3),
                0 0 0 1px rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            filter: saturate(0.9) brightness(1.1);
            object-fit: cover;
        }

        .bandeira:hover {
            transform: translateY(-15px) rotateX(10deg) rotateY(10deg) scale(1.05);
            box-shadow: 
                0 25px 50px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255,255,255,0.2),
                0 0 30px rgba(255,255,255,0.1);
            filter: saturate(1.2) brightness(1.2);
        }

        .flag-card::before {
            content: attr(data-lang);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.9);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 1px;
            opacity: 0;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .flag-card:hover::before {
            opacity: 1;
            bottom: -35px;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .flags-container {
                gap: 20px;
            }
            .bandeira {
                width: 90px;
                height: 60px;
            }
        }

        /* Animação de entrada */
        .flag-card {
            animation: slideInUp 0.8s ease forwards;
            opacity: 0;
        }

        .flag-card:nth-child(1) { animation-delay: 0.1s; }
        .flag-card:nth-child(2) { animation-delay: 0.2s; }
        .flag-card:nth-child(3) { animation-delay: 0.3s; }
        .flag-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍣 Menu Sushi</h1>
        <p class="subtitle">Selecione o seu idioma</p>
        
        <div class="flags-container">
            <a href="menu_en.pdf" target="_blank" class="flag-card" data-lang="English">
                <img src="bandeira_en.png" alt="English" class="bandeira">
            </a>

            <a href="menu_es.pdf" target="_blank" class="flag-card" data-lang="Español">
                <img src="bandeira_es.png" alt="Español" class="bandeira">
            </a>

            <a href="menu_nl.pdf" target="_blank" class="flag-card" data-lang="Nederlands">
                <img src="bandeira_nl.png" alt="Nederlands" class="bandeira">
            </a>

            <a href="menu_fr.pdf" target="_blank" class="flag-card" data-lang="Français">
                <img src="bandeira_fr.png" alt="Français" class="bandeira">
            </a>
        </div>
    </div>

</body>
</html>
